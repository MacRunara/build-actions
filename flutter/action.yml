# GitHub Action: Macrunara Flutter Build
# =============================================================================
# 在 Macrunara Mac CI 集群上执行 Flutter 构建链路：
# pub get → analyze → test（可关）→ build ipa（无签名）/ build apk。
# 节点镜像（macos-mobile v1.2+）已预装 Flutter stable（~/flutter），
# 本 action 默认使用预装版；仅在 flutter-version 显式给值时才调 flutter-action 切换。
#
# 使用方式：
#   - uses: macrunara/build-actions/flutter@v1
#     with:
#       platform: all        # ios | android | all
#       build-mode: release  # debug | release
# =============================================================================

name: 'Macrunara Flutter Build'
description: 'Flutter pub get / analyze / test / build ipa|apk on a Macrunara Mac runner'
author: 'Macrunara'

branding:
  icon: 'wind'
  color: 'blue'

inputs:
  platform:
    description: 'Build target: ios | android | all'
    required: false
    default: 'all'

  flutter-version:
    description: 'Flutter version to install via flutter-action (empty = use preinstalled stable)'
    required: false
    default: ''

  build-mode:
    description: 'Build mode: debug | release'
    required: false
    default: 'debug'

  run-tests:
    description: 'Run flutter analyze + test before building (true/false)'
    required: false
    default: 'true'

  upload_artifact:
    description: 'Whether to upload build artifacts (true/false)'
    required: false
    default: 'true'

  artifact_name:
    description: 'Name of the uploaded artifact'
    required: false
    default: 'flutter-build-products'

  # --- V1.1-2.1 iOS 签名（可选；distribution != none 时生效） -------------------
  distribution:
    description: 'iOS distribution target: none | local | pgyer | testflight | firebase. none = unsigned build (default). Upload-type distribution deferred; signed IPA delivered via Artifacts.'
    required: false
    default: 'none'

  sign_p12_base64:
    description: 'Base64-encoded .p12 signing certificate (single line)'
    required: false

  sign_password:
    description: 'Password of the .p12 certificate (masked in logs)'
    required: false

  mobileprovision_base64:
    description: 'Base64-encoded .mobileprovision provisioning profile (single line)'
    required: false

  ios-workspace:
    description: 'iOS workspace path for signed archive'
    required: false
    default: 'ios/Runner.xcworkspace'

  ios-scheme:
    description: 'iOS scheme for signed archive'
    required: false
    default: 'Runner'

  # --- V1.1-2.1 Android 签名（可选；提供 sign_keystore_base64 即生效） ----------
  sign_keystore_base64:
    description: 'Base64-encoded .jks/.keystore (single line). Empty = default debug signing.'
    required: false

  keystore_password:
    description: 'Keystore store password (masked in logs)'
    required: false

  key_alias:
    description: 'Key alias inside the keystore'
    required: false

  key_password:
    description: 'Key password (masked in logs)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Show Action Info
      shell: bash
      run: |
        echo "::group::Macrunara Flutter Build"
        echo "platform:        ${{ inputs.platform }}"
        echo "flutter-version: ${{ inputs.flutter-version }} (empty = preinstalled)"
        echo "build-mode:      ${{ inputs.build-mode }}"
        echo "run-tests:       ${{ inputs.run-tests }}"
        echo "::endgroup::"

    # 预装 Flutter 在 ~/flutter/bin，非登录 shell 默认 PATH 不含它——
    # 写入 $GITHUB_PATH，保证本 action 之后 job 内的所有 step 都能直接调 flutter。
    - name: Export preinstalled Flutter PATH
      shell: bash
      run: |
        if [ -x "$HOME/flutter/bin/flutter" ]; then
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$HOME/flutter" 2>/dev/null || true
          echo "preinstalled flutter: $("$HOME/flutter/bin/flutter" --version 2>/dev/null | head -1)"
        else
          echo "::notice::preinstalled flutter not found at ~/flutter; rely on flutter-action or job-level setup"
        fi

    # 可选：锁定 Flutter 版本（默认不需要，节点已预装 stable）
    - name: Setup Flutter (only when flutter-version is set)
      if: ${{ inputs.flutter-version != '' }}
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable

    # 签名材料先打码（V1.1-2.1）
    - name: Mask signing secrets
      if: ${{ inputs.distribution != 'none' || inputs.sign_keystore_base64 != '' }}
      shell: bash
      run: |
        echo "::add-mask::${{ inputs.sign_password }}"
        echo "::add-mask::${{ inputs.sign_p12_base64 }}"
        echo "::add-mask::${{ inputs.mobileprovision_base64 }}"
        echo "::add-mask::${{ inputs.keystore_password }}"
        echo "::add-mask::${{ inputs.key_password }}"
        echo "::add-mask::${{ inputs.sign_keystore_base64 }}"

    # iOS：临时 keychain + 证书/描述文件（复用 ios action 的脚本）
    - name: Setup iOS signing
      if: ${{ inputs.distribution != 'none' }}
      shell: bash
      run: |
        ENV_FILE="${{ runner.temp }}/signing.env"
        bash "${{ github.action_path }}/../ios/scripts/setup-signing.sh" \
          "${{ inputs.sign_p12_base64 }}" \
          "${{ inputs.sign_password }}" \
          "${{ inputs.mobileprovision_base64 }}" \
          "${{ inputs.distribution }}" \
          "$ENV_FILE"
        cat "$ENV_FILE" >> "$GITHUB_ENV"
        echo "MACRUNARA_IOS_WORKSPACE=${{ inputs.ios-workspace }}" >> "$GITHUB_ENV"
        echo "MACRUNARA_IOS_SCHEME=${{ inputs.ios-scheme }}" >> "$GITHUB_ENV"

    # Android：keystore + init.d 零侵入注入（复用 android action 的脚本）
    - name: Setup Android signing
      if: ${{ inputs.sign_keystore_base64 != '' }}
      shell: bash
      run: |
        ENV_FILE="${{ runner.temp }}/android-signing.env"
        bash "${{ github.action_path }}/../android/scripts/setup-android-signing.sh" \
          "${{ inputs.sign_keystore_base64 }}" \
          "${{ inputs.keystore_password }}" \
          "${{ inputs.key_alias }}" \
          "${{ inputs.key_password }}" \
          "$ENV_FILE"
        cat "$ENV_FILE" >> "$GITHUB_ENV"

    - name: Flutter build pipeline
      shell: bash
      run: |
        bash "${{ github.action_path }}/scripts/build.sh" \
          "${{ inputs.platform }}" \
          "${{ inputs.build-mode }}" \
          "${{ inputs.run-tests }}"

    - name: Upload artifact
      if: ${{ inputs.upload_artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: |
          build/ios/iphoneos/
          build/ios/Exported/
          build/app/outputs/flutter-apk/
        if-no-files-found: warn
