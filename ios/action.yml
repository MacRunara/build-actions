# GitHub Action: Macrunara iOS Build
# =============================================================================
# 在 Macrunara Mac CI 集群上执行 Xcode 构建、归档导出与产物上传。
# 自 macrunara/local-mac-runner-action 迁入（inputs 与行为完全一致）。
#
# 使用方式：
#   - uses: macrunara/build-actions/ios@v1
#     with:
#       scheme: MyApp
#       project: MyApp.xcodeproj
#       configuration: Release
#       sdk: iphoneos
#       upload_artifact: true
# =============================================================================

name: 'Macrunara iOS Build'
description: 'Build and export an Xcode project on a Macrunara Mac runner'
author: 'Macrunara'

branding:
  icon: 'command'
  color: 'blue'

inputs:
  scheme:
    description: 'Xcode scheme to build'
    required: true

  project:
    description: 'Xcode project or workspace path (optional)'
    required: false

  configuration:
    description: 'Build configuration (e.g., Release, Debug)'
    required: false
    default: 'Release'

  sdk:
    description: 'SDK to build against (e.g., iphoneos, macosx)'
    required: false
    default: 'iphoneos'

  upload_artifact:
    description: 'Whether to upload the artifact path (true/false)'
    required: false
    default: 'true'

  artifact_name:
    description: 'Name of the uploaded artifact'
    required: false
    default: 'build-products'

  artifact_path:
    description: 'Path to the artifact directory to upload'
    required: false
    default: 'build/Release-iphoneos'

  # --- V1.1-2.1 签名链路（可选；distribution != none 时生效） -------------------
  sign_p12_base64:
    description: 'Base64-encoded .p12 signing certificate (single line). Stored as a secret; masked in logs.'
    required: false

  sign_password:
    description: 'Password of the .p12 certificate. Stored as a secret; masked in logs.'
    required: false

  mobileprovision_base64:
    description: 'Base64-encoded .mobileprovision provisioning profile (single line).'
    required: false

  distribution:
    description: 'Distribution target: none | local | pgyer | testflight | firebase. none = unsigned build (default). pgyer/testflight/firebase upload is deferred; the signed IPA is delivered via GitHub Artifacts.'
    required: false
    default: 'none'

runs:
  using: 'composite'
  steps:
    - name: Show Action Info
      shell: bash
      run: |
        echo "::group::Macrunara iOS Build"
        echo "scheme:        ${{ inputs.scheme }}"
        echo "project:       ${{ inputs.project }}"
        echo "configuration: ${{ inputs.configuration }}"
        echo "sdk:           ${{ inputs.sdk }}"
        echo "upload_artifact: ${{ inputs.upload_artifact }}"
        echo "artifact_path: ${{ inputs.artifact_path }}"
        echo "distribution:  ${{ inputs.distribution }}"
        echo "::endgroup::"

    # 签名材料先打码：后续任何步骤意外回显都会被 Actions 替换为 ***
    - name: Mask signing secrets
      if: ${{ inputs.distribution != 'none' }}
      shell: bash
      run: |
        echo "::add-mask::${{ inputs.sign_password }}"
        echo "::add-mask::${{ inputs.sign_p12_base64 }}"
        echo "::add-mask::${{ inputs.mobileprovision_base64 }}"

    # 临时 keychain + 证书/描述文件安装；产出的签名环境变量注入后续步骤
    - name: Setup signing keychain
      if: ${{ inputs.distribution != 'none' }}
      shell: bash
      run: |
        ENV_FILE="${{ runner.temp }}/signing.env"
        bash "${{ github.action_path }}/scripts/setup-signing.sh" \
          "${{ inputs.sign_p12_base64 }}" \
          "${{ inputs.sign_password }}" \
          "${{ inputs.mobileprovision_base64 }}" \
          "${{ inputs.distribution }}" \
          "$ENV_FILE"
        cat "$ENV_FILE" >> "$GITHUB_ENV"

    # 构建逻辑在 scripts/build.sh，便于本地单测（见 tests/run_tests.sh）。
    # 用 bash 显式调用可规避脚本 +x 权限在 git 中丢失的问题。
    # SIGNING_ENABLED=1 时 build.sh 自动切换为手动签名 archive 模式。
    - name: Build Xcode project
      shell: bash
      run: |
        bash "${{ github.action_path }}/scripts/build.sh" \
          "${{ inputs.scheme }}" \
          "${{ inputs.project }}" \
          "${{ inputs.configuration }}" \
          "${{ inputs.sdk }}"

    # 无 .xcarchive 时跳过；导出失败仅输出 warning，不中断 workflow。
    # SIGNING_ENABLED=1 时使用 EXPORT_METHOD/TEAM_ID/PROFILE_NAME 手动签名导出。
    - name: Export archive if present
      shell: bash
      run: |
        bash "${{ github.action_path }}/scripts/export-archive.sh"

    - name: Upload artifact
      if: ${{ inputs.upload_artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.artifact_path }}
        if-no-files-found: warn

    # 签名 IPA 单独上传（distribution != none 时），与未签名 .app 产物互不干扰
    - name: Upload signed IPA
      if: ${{ inputs.distribution != 'none' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}-signed-ipa
        path: build/Exported/*.ipa
        if-no-files-found: warn
